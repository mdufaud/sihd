name: ci

# Fast lane: one Ubuntu job on every push/PR — build + tests with warm vcpkg cache.
# Everything else (cross builds, web, android) lives in ci-nightly.yml.

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.internal/**'
      - 'tmp/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.internal/**'
      - 'tmp/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-gcc:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # full history: the builtin-baseline declared in app.py sits months behind main
      # and a shallow clone cannot resolve it (vcpkg on-demand fetch fails when shallow)
      - name: Checkout vcpkg (upstream main)
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: master
          path: .vcpkg
          fetch-depth: 0

      - name: Bootstrap vcpkg
        run: |
          .vcpkg/bootstrap-vcpkg.sh
          mkdir -p .vcpkg/archives

      - name: Cache vcpkg binary archives (x64-linux)
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg/archives
          key: vcpkg-x64-linux-${{ hashFiles('app.py', 'site_scons/addon/vcpkg/**', 'site_scons/sbt/vcpkg/**') }}
          restore-keys: vcpkg-x64-linux-

      - name: Install scons
        run: |
          make setup
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # native linux build with imgui/glfw3 needs X11 + GL dev headers, libusb udev
      # feature needs libudev (no vcpkg port) — all absent from runner images
      - name: Install X11/GL/libudev dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libgl1-mesa-dev libglew-dev libudev-dev libusb-1.0-0-dev libpcap-dev autoconf autoconf-archive automake libtool libltdl-dev

      - name: Install dependencies
        run: make dep test=1 demo=1

      - name: Build (libs, tests, demos)
        run: make test=1 demo=1

      - name: Run tests
        run: make itest
        # ICMPv6 echo to external hosts: runners have no outbound IPv6
        env:
          TEST_FILTER_FLAG: --gtest_filter=*-*test_icmp_ipv6*

      - name: Report binary cache size
        if: always()
        run: du -sh .vcpkg/archives 2>/dev/null || true

      # save even on failure: cold-cache iterations keep their partial progress
      - name: Save vcpkg binary archives
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .vcpkg/archives
          key: vcpkg-x64-linux-${{ hashFiles('app.py', 'site_scons/addon/vcpkg/**', 'site_scons/sbt/vcpkg/**') }}
