name: ci-nightly

# Full matrix, all cross-compiled from Ubuntu runners (no Windows/macOS runners:
# free minutes are identical but this keeps costs at 1x if the repo ever goes private).
# Each matrix entry has its own vcpkg binary-cache entry, keyed by triplet:
# a dependency bump only rewrites that triplet's cache, not the whole blob.

on:
  schedule:
    - cron: '0 3 * * *' # daily, UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    continue-on-error: ${{ matrix.experimental || false }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
    strategy:
      fail-fast: false
      matrix:
        include:
          # mirrors .internal/dependencies.sh + .internal/compile.sh: the dep step
          # takes the SAME config selectors as the build (otherwise it runs in the
          # default gcc config and stages extlib where the build never looks), and
          # demo=1 goes on both because bare make builds demos (cli11/ftxui are
          # dep-gated on it)
          - id: x64-linux
            dep-args: test=1 demo=1
            make-args: test=1 demo=1
            apt: libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libgl1-mesa-dev libglew-dev libudev-dev libusb-1.0-0-dev libpcap-dev autoconf autoconf-archive automake libtool libltdl-dev
            itest: true
          - id: x64-linux-clang
            dep-args: compiler=clang demo=1
            make-args: compiler=clang demo=1
            apt: libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libgl1-mesa-dev libglew-dev libudev-dev libusb-1.0-0-dev libpcap-dev autoconf autoconf-archive automake libtool libltdl-dev
          # musl.cc is unreachable from runners; zig carries its own musl sysroot
          # (sbt: MUSL_ONLY_COMPILERS) so it keeps libc=musl coverage in CI
          - id: x64-linux-zig-musl
            dep-args: compiler=zig demo=1
            make-args: compiler=zig mode=size demo=1
            zig: true
          - id: arm64-linux
            dep-args: machine=aarch64 demo=1
            make-args: machine=aarch64 demo=1
            apt: libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libgl1-mesa-dev libglew-dev libudev-dev libusb-1.0-0-dev libpcap-dev autoconf autoconf-archive automake libtool libltdl-dev gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          - id: riscv64-linux
            dep-args: machine=riscv64 demo=1
            make-args: machine=riscv64 demo=1
            apt: libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libgl1-mesa-dev libglew-dev libudev-dev libusb-1.0-0-dev libpcap-dev autoconf autoconf-archive automake libtool libltdl-dev gcc-riscv64-linux-gnu g++-riscv64-linux-gnu
          - id: x64-mingw-dynamic
            dep-args: platform=windows demo=1
            make-args: platform=windows demo=1
            apt: libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libgl1-mesa-dev libglew-dev libudev-dev libusb-1.0-0-dev libpcap-dev autoconf autoconf-archive automake libtool libltdl-dev gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
            env: 'py=0'
          - id: wasm32-emscripten
            dep-args: compiler=em m=util,sys,core,csv,zip,net demo=1
            make-args: compiler=em m=util,sys,core,csv,zip,net demo=1
            apt: libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libgl1-mesa-dev libglew-dev libudev-dev libusb-1.0-0-dev libpcap-dev autoconf autoconf-archive automake libtool libltdl-dev
            env: 'lua=0 py=0'
            emsdk: true
          - id: arm64-android
            dep-args: platform=android machine=aarch64 static=1 m=util,imgui demo=1
            make-args: platform=android machine=aarch64 static=1 m=util,imgui demo=1
            apt: libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libgl1-mesa-dev libglew-dev libudev-dev libusb-1.0-0-dev libpcap-dev autoconf autoconf-archive automake libtool libltdl-dev
            android: true
            experimental: true # first runs tell if the hosted NDK/gradle setup is enough

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # full history: the builtin-baseline declared in app.py sits months behind main
      # and a shallow clone cannot resolve it (vcpkg on-demand fetch fails when shallow)
      - name: Checkout vcpkg (upstream main)
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: master
          path: .vcpkg
          fetch-depth: 0

      - name: Bootstrap vcpkg
        run: |
          .vcpkg/bootstrap-vcpkg.sh
          mkdir -p .vcpkg/archives

      - name: Cache vcpkg binary archives (${{ matrix.id }})
        uses: actions/cache@v4
        with:
          path: .vcpkg/archives
          key: vcpkg-${{ matrix.id }}-${{ hashFiles('app.py', 'site_scons/addon/vcpkg/**', 'site_scons/sbt/vcpkg/**') }}
          restore-keys: vcpkg-${{ matrix.id }}-

      - name: Install system packages
        if: matrix.apt
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Install zig
        if: matrix.zig
        run: |
          URL=$(curl -s https://ziglang.org/download/index.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(next(d[v]['x86_64-linux']['tarball'] for v in d if v != 'master'))")
          echo "zig tarball: $URL"
          curl -fsSL "$URL" -o /tmp/zig.tar.xz
          sudo tar -xJf /tmp/zig.tar.xz -C /usr/local
          echo "/usr/local/$(tar -tf /tmp/zig.tar.xz | head -1 | cut -d/ -f1)" >> "$GITHUB_PATH"

      - name: Generate android debug signing config
        if: matrix.android
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          printf 'storeFile=debug.keystore\nstorePassword=android\nkeyAlias=androiddebugkey\nkeyPassword=android\n' > keystore.properties

      - name: Setup emsdk
        if: matrix.emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Resolve Android NDK
        if: matrix.android
        run: echo "ANDROID_NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -1)" >> "$GITHUB_ENV"

      - name: Install scons
        run: |
          make setup
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: make dep ${{ matrix.dep-args }} ${{ matrix.env }}

      - name: Build
        run: make ${{ matrix.make-args }} ${{ matrix.env }}

      - name: Run tests
        if: matrix.itest
        run: make itest
        # ICMPv6 echo to external hosts: runners have no outbound IPv6
        env:
          TEST_FILTER_FLAG: --gtest_filter=*-*test_icmp_ipv6*

      - name: Report binary cache size
        if: always()
        run: du -sh .vcpkg/archives 2>/dev/null || true
